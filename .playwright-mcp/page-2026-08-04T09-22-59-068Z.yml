            - generic [ref=e326]: Braucht man in Belgien eine Genehmigung zum Baumfällen?
            - generic [ref=e327]: +
          - generic [ref=e328]: In Belgien ist für das Fällen geschützter Bäume eine Genehmigung des Gemeindekollegiums erforderlich. In den meisten Gemeinden Ostbelgiens gilt dies ab einem Stammumfang von 50 bis 60 cm. Angepflanzte Bäume benötigen unabhängig von ihrer Größe oft eine Genehmigung. Fabry Baumpflege berät zur geltenden Regelung und hilft bei der Antragstellung.
        - generic [ref=e331]:
          - button "Welche Gemeinden und Regionen werden abgedeckt? +" [ref=e332] [cursor=pointer]:
            - generic [ref=e333]: Welche Gemeinden und Regionen werden abgedeckt?
            - generic [ref=e334]: +
          - generic: "Fabry Baumpflege ist in der gesamten Deutschsprachigen Gemeinschaft Belgiens tätig: Eupen, Raeren, Kelmis, Lontzen, Sankt-Vith, Malmedy, Bütgenbach, Büllingen und Umgebung. Auch angrenzende französischsprachige Orte wie Verviers, Aubel, Welkenraedt, Limbourg und Herve werden bedient."
        - generic [ref=e336]:
          - button "Was kostet eine Baumfällung? +" [ref=e337] [cursor=pointer]:
            - generic [ref=e338]: Was kostet eine Baumfällung?
            - generic [ref=e339]: +
          - paragraph [ref=e341]: Die Kosten hängen von Baumhöhe, Standort, Zugänglichkeit und gewünschter Entsorgung ab. Nach einer kostenlosen Vor-Ort-Besichtigung wird ein unverbindliches Angebot erstellt.
        - generic [ref=e342]:
          - button "Wann ist der beste Zeitpunkt für einen Baumschnitt? +" [ref=e343] [cursor=pointer]:
            - generic [ref=e344]: Wann ist der beste Zeitpunkt für einen Baumschnitt?
            - generic [ref=e345]: +
          - generic: Leichte Pflegeschnitte sind ganzjährig möglich. Stärkere Eingriffe empfehlen sich in der Vegetationsruhe von November bis Februar. Aus Artenschutzgründen sind starke Schnitte an Hecken und Bäumen von März bis September gesetzlich eingeschränkt. Ausnahmen gelten bei Verkehrssicherung und Gefahrensituationen.
        - generic [ref=e347]:
          - button "Was tun, wenn ein Baum nach einem Sturm gefährlich wird? +" [ref=e348] [cursor=pointer]:
            - generic [ref=e349]: Was tun, wenn ein Baum nach einem Sturm gefährlich wird?
            - generic [ref=e350]: +
          - generic: Zunächst den Gefahrenbereich absichern und Abstand halten. Fabry Baumpflege ist für Notfalleinsätze in Ostbelgien erreichbar. Mithilfe der Seilklettertechnik (SKT) und kontrollierter Abseilverfahren werden Sturmschäden sicher und schnell abgetragen.
        - generic [ref=e352]:
          - button "Ist Baumfällung in den Sommermonaten erlaubt? +" [ref=e353] [cursor=pointer]:
            - generic [ref=e354]: Ist Baumfällung in den Sommermonaten erlaubt?
            - generic [ref=e355]: +
          - generic: Aus Vogelschutz- und Artenschutzgründen sind starke Schnitte an Bäumen und Hecken von März bis September grundsätzlich eingeschränkt. Verkehrssicherungsmaßnahmen und Gefahrenbaumfällungen sind jedoch ganzjährig zulässig. Die rechtliche Situation in der jeweiligen Gemeinde wird auf Anfrage geklärt.
        - generic [ref=e357]:
          - button "Wird auch Gartenpflege und Bepflanzung angeboten? +" [ref=e358] [cursor=pointer]:
            - generic [ref=e359]: Wird auch Gartenpflege und Bepflanzung angeboten?
            - generic [ref=e360]: +
          - generic: Neben Baumpflege und Baumfällung umfasst das Angebot auch vollständige Gartenpflege (Heckenschnitt, Rasenpflege, Beetaufbereitung) sowie fachgerechte Neupflanzungen von Bäumen, Sträuchern und Stauden. Auf Anfrage sind individuelle Pflegepakete erhältlich.
