      - heading "Baum und Gartenpflege aus einer Hand" [level=2] [ref=e40]
      - generic [ref=e43]:
        - paragraph [ref=e48]: Bäume wachsen. Mal besser, mal weniger kontrolliert. Genau da setzt Baumpflege an und sorgt für Struktur, Sicherheit und langfristige Gesundheit.
        - paragraph [ref=e53]: Beim Rückschnitt geht es nicht nur ums „schön aussehen“, sondern darum, dass der Baum gesund bleibt und stabil wächst.
        - paragraph [ref=e58]: Wenn ein Baum weg muss, wird das sauber vorbereitet und Schritt für Schritt umgesetzt. Gerade bei wenig Platz kommt Seilklettertechnik zum Einsatz, damit nichts beschädigt wird, was stehen bleiben soll.
        - paragraph [ref=e63]: Auch im Garten selbst fällt genug an. Pflege, Schnittarbeiten oder neue Bepflanzung. Am Ende soll es einfach ordentlich aussehen und funktionieren.
