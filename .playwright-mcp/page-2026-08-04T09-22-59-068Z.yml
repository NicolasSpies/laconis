      - generic [ref=e136]:
        - link [ref=e137] [cursor=pointer]:
          - /url: /referenzen/verkehrssicherheit-entlang-einer-strasse
          - generic [ref=e138]:
            - img "Iveco-Hubsteiger mit ausgefahrenem Arm zwischen Bäumen in einem Waldweg." [ref=e139]
            - generic [ref=e140]:
              - generic [ref=e141]:
                - generic [ref=e142]: Baumpflege
                - generic [ref=e144]: Eupen
              - heading "Verkehrssicherheit entlang einer Straße" [level=3] [ref=e145]
              - paragraph [ref=e146]: Bei diesem Einsatz stand die Wiederherstellung der Verkehrssicherheit entlang einer Straße in steiler Hanglage im Mittelpunkt. An mehreren Eichen wurde Totholz fachgerecht entfernt, um potenzielle Gefahren für den Straßenverkehr und Passanten zu beseitigen. Aufgrund der anspruchsvollen Geländesituation entschieden wir uns bewusst für eine Kombination aus Hubsteiger und Seilklettertechnik (SKT). Diese Arbeitsweise ermöglichte es uns, alle Bereiche der Bäume sicher und effizient zu erreichen und die Arbeiten zügig durchzuführen. Durch den gezielten Einsatz beider Verfahren konnten wir den Auftrag entlang der Straße schnell, sicher und mit möglichst geringer Beeinträchtigung des Verkehrs abschließen. So wurde die Verkehrssicherheit nachhaltig wiederhergestellt und die wertvollen Eichen konnten gleichzeitig schonend erhalten werden. Ob Verkehrssicherungsmaßnahmen, Totholzentfernung oder anspruchsvolle Baumarbeiten in schwierigem Gelände – wir bieten sichere und professionelle Lösungen für jede Herausforderung.
              - generic [ref=e147]: Mehr erfahren
        - link [ref=e151] [cursor=pointer]:
          - /url: /referenzen/kronenpflege-apfelbaum
          - generic [ref=e152]:
            - img "Dichter Wald mit grünen Laubbäumen unter bewölktem Himmel, alte Bäume mit ausladenden Ästen." [ref=e153]
            - generic [ref=e154]:
              - generic [ref=e155]:
                - generic [ref=e156]: Baumpflege
                - generic [ref=e158]: Eupenn
              - heading "Kronenpflege - Apfelbaum" [level=3] [ref=e159]
              - paragraph [ref=e160]: Bei diesem Projekt stand der langfristige Erhalt eines alten Apfelbaums im Mittelpunkt. Durch eine gezielte Auslichtung wurde die Krone entlastet und die Baumgesundheit gefördert. Zusätzlich erfolgte eine biologische Behandlung gegen die Gespinstmotte und die Blutlaus – vollständig ohne den Einsatz chemischer Pflanzenschutzmittel. Die Raupen der Gespinstmotte können ganze Zweige mit ihren charakteristischen Gespinsten überziehen und durch starken Blattfraß die Vitalität des Baumes beeinträchtigen. Die Blutlaus saugt an jungen Trieben und Ästen, wodurch Wucherungen, Rindenschäden und Wachstumsstörungen entstehen können. Durch die fachgerechte Pflege und die biologische Behandlung konnte die Gesundheit des Baumes nachhaltig gefördert werden. Sollten Sie an Ihren Obstbäumen Auffälligkeiten feststellen oder Fragen zur Baumgesundheit haben, stehen wir Ihnen gerne für eine Begutachtung und Beratung vor Ort zur Verfügung.
              - generic [ref=e161]: Mehr erfahren
        - link [ref=e165] [cursor=pointer]:
          - /url: /referenzen/eichenprozessionspinner-entfernung
          - generic [ref=e166]:
            - img "Schlange auf Baumrinde mit Moos und Flechten, umgeben von grünen Blättern." [ref=e167]
            - generic [ref=e168]:
              - generic [ref=e169]:
                - generic [ref=e170]: Baumpflege
                - generic [ref=e172]: Gemmenich
              - heading "Eichenprozessionspinner Entfernung" [level=3] [ref=e173]
              - paragraph [ref=e174]: Im Rahmen eines Vor-Ort-Termins wurde an einer Eiche ein Befall durch den Eichenprozessionsspinner festgestellt. Das Nest wurde anschließend fachgerecht entfernt, um die von den Raupen ausgehende Gefahr für Menschen und Tiere zu beseitigen. Der Eichenprozessionsspinner stellt insbesondere durch seine Brennhaare ein erhebliches Gesundheitsrisiko dar. Die feinen Haare enthalten ein Nesselgift und können bereits bei Hautkontakt oder durch die Luft übertragen starke Hautreizungen, Juckreiz, Augenreizungen sowie Atemwegsbeschwerden verursachen. Die Brennhaare bleiben zudem über lange Zeit in alten Nestern aktiv und können auch nach dem Verlassen der Raupen noch gesundheitliche Probleme auslösen. Sollten Sie an Ihren Bäumen einen Verdacht auf Eichenprozessionsspinner haben oder ein Nest entdecken, nehmen Sie gerne Kontakt mit uns auf. Eine frühzeitige Begutachtung hilft dabei, Risiken rechtzeitig zu erkennen und geeignete Maßnahmen einzuleiten.
              - generic [ref=e175]: Mehr erfahren
